name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Addon
        run: python3 scripts/bundle.py --check-only --package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anki-vaultsync.ankiaddon
          generate_release_notes: true
